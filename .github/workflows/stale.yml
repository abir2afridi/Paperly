name: 🧹 Mark Stale Issues and PRs

on:
  schedule:
    - cron: '0 2 * * *'   # Daily at 02:00 UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: 🧹 Stale Issue Management
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: |
            👋 This issue has been automatically marked as **stale** because
            it has not had activity in 60 days.

            It will be **automatically closed in 14 days** if no further
            activity occurs. If this is still relevant:
            - 💬 Leave a comment with an update
            - 🏷️ Remove the `stale` label
            - 🔗 Link any related ongoing work

            Thank you for contributing to Paperly! 🙏
          close-issue-message: |
            🔒 This issue was automatically closed after 14 days of inactivity
            following the stale notice.

            If this is still a valid issue, please open a new issue with
            updated information. We appreciate your contribution!

          # Pull Requests
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: |
            👋 This pull request has been automatically marked as **stale**
            because it has not had activity in 30 days.

            It will be **automatically closed in 14 days** if no further
            activity occurs. If this PR is still relevant:
            - 💬 Leave a comment with a status update
            - 🔄 Rebase and resolve any conflicts
            - 🏷️ Remove the `stale` label

            Thank you for your contribution to Paperly! 🙏
          close-pr-message: |
            🔒 This PR was automatically closed after 14 days of inactivity
            following the stale notice.

            Please feel free to reopen or create a new PR if the work
            is still relevant. Thank you!

          # Never mark these as stale
          exempt-issue-labels: >
            pinned,security,in-progress,confirmed,
            priority: critical,priority: high,help wanted,good first issue
          exempt-pr-labels: >
            pinned,in-progress,priority: critical,priority: high

          # Don't close issues with these labels
          exempt-all-milestones: true
