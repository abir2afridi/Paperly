name: 📝 Documentation Issue
description: Report missing, incorrect, or confusing documentation
title: "[Docs]: "
labels: [documentation, needs-triage]
assignees: []
body:

  - type: markdown
    attributes:
      value: |
        ## 📝 Documentation Issue
        Good documentation is crucial for **Paperly**'s success.
        Thank you for helping us improve it!

        > 💡 The documentation lives in the [README](https://github.com/abir2afridi/Paperly#readme)
        > and the [docs/ folder](https://github.com/abir2afridi/Paperly/tree/main/docs).

  - type: checkboxes
    id: preflight
    attributes:
      label: ✅ Preflight Checklist
      options:
        - label: I have searched for existing documentation issues
          required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: 📋 Issue Type
      options:
        - Missing documentation — this topic is not covered at all
        - Incorrect information — something documented is wrong
        - Outdated content — information is correct but no longer current
        - Unclear / confusing — hard to understand even if technically correct
        - Typo or grammar error
        - Broken link or missing image
        - Code example doesn't work
    validations:
      required: true

  - type: dropdown
    id: doc-area
    attributes:
      label: 📂 Documentation Area
      description: Which area of the documentation is affected?
      options:
        - README (features, setup, env vars)
        - docs/plan.md (feature plan / roadmap)
        - docs/ai.md (AI providers)
        - docs/security.md (security model)
        - docs/compilation.md (LaTeX compilation)
        - docs/issues.md (issue templates / workflows)
        - FEATURE_AUDIT.md
        - Getting Started / Installation
        - Other
    validations:
      required: true

  - type: input
    id: doc-url
    attributes:
      label: 🔗 Link to Problematic Page
      description: Paste the URL or file path to the documentation with the issue
      placeholder: "https://github.com/abir2afridi/Paperly/blob/main/docs/ai.md or README.md"
    validations:
      required: false

  - type: textarea
    id: current-content
    attributes:
      label: ❌ What's Wrong
      description: Describe what is incorrect, missing, or confusing
      placeholder: |
        The documentation currently says / doesn't say [X].
        This is wrong / missing because [Y].
    validations:
      required: true

  - type: textarea
    id: suggested-improvement
    attributes:
      label: ✅ Suggested Improvement
      description: How should the documentation be improved?
      placeholder: |
        The documentation should instead say [X].
        Or: This section should be added covering [topic].
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: 🤝 Contribution
      options:
        - label: I am willing to submit a PR to fix this documentation issue
          required: false

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: 📜 Code of Conduct
      options:
        - label: I agree to follow Paperly's [Code of Conduct](../CODE_OF_CONDUCT.md)
          required: true
