name: 🐛 Bug Report
description: >
  Report a bug in Paperly. Please fill in as much detail as possible.
title: "[Bug]: "
labels: [bug, needs-triage]
assignees: []
body:

  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report
        Thanks for taking the time to report a bug in **Paperly**.
        The more detail you provide, the faster we can fix it.

        > ⚠️ **Before submitting:** Please [search existing issues](../../issues)
        > to make sure this hasn't been reported already.

  - type: checkboxes
    id: preflight
    attributes:
      label: ✅ Preflight Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have read the [README](https://github.com/abir2afridi/Paperly#readme) and [docs folder](https://github.com/abir2afridi/Paperly/tree/main/docs)
          required: true
        - label: I am using a supported version of Paperly
          required: true

  - type: dropdown
    id: version
    attributes:
      label: 📦 Version
      description: Which version of Paperly are you using?
      options:
        - Latest (v0.0.0)
        - Built from source (git clone of main)
        - Other (specify in additional context)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 🖥️ Operating System
      description: What OS are you running?
      multiple: false
      options:
        - Windows 10
        - Windows 11
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Ubuntu / Debian
        - Fedora / RHEL
        - Arch Linux
        - Other Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: 🌐 Browser
      description: Which browser are you using? (Skip if you are using the Tauri desktop app)
      multiple: false
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Brave
        - Opera
        - Not applicable (Tauri desktop app)
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: 🟢 Node.js Version
      description: Run `node --version` and paste the output
      placeholder: "e.g., v20.11.0"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: 🚀 How Are You Running Paperly?
      description: Where does the bug occur?
      options:
        - Local development (npm run dev)
        - Tauri desktop app (npm run tauri:dev)
        - Self-hosted web deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 🐛 Bug Description
      description: A clear description of what the bug is
      placeholder: |
        What happened? What did you observe?
        Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 🔁 Steps to Reproduce
      description: Exact steps to reproduce the behavior
      placeholder: |
        1. Open a project in the workspace
        2. Click on '...'
        3. Type '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: ✅ Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: ❌ Actual Behavior
      description: What actually happened instead?
      placeholder: Instead, what happened was...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 Severity
      description: How severely does this bug impact your use of Paperly?
      options:
        - Critical — App is completely unusable
        - High — Major feature is broken or unavailable
        - Medium — Feature works partially or has a workaround
        - Low — Minor visual issue or rare edge case
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 📊 Frequency
      description: How often does this bug occur?
      options:
        - Always (100% reproducible)
        - Often (most of the time)
        - Sometimes (intermittent)
        - Rarely (hard to reproduce)
        - Only once
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📋 Error Logs / Console Output
      description: Paste any relevant error messages, stack traces, or console output
      placeholder: Paste logs here...
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 📸 Screenshots / Screen Recording
      description: Drag and drop images or paste a screen recording link
      placeholder: |
        Drag and drop images here, or paste a link to a screen recording.
        Before: [screenshot]
        After: [screenshot]
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 💬 Additional Context
      description: Anything else that might help us understand the issue?
      placeholder: Any other context, related issues, or links...
    validations:
      required: false

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: 📜 Code of Conduct
      options:
        - label: I agree to follow Paperly's [Code of Conduct](../CODE_OF_CONDUCT.md)
          required: true
