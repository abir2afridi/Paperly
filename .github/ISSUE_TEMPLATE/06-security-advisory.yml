name: 🔒 Security Vulnerability Report
description: >
  ⚠️ DO NOT report security vulnerabilities here.
  This redirects you to private reporting channels.
title: "[Security]: Use private reporting — see instructions below"
labels: [security]
assignees: []
body:

  - type: markdown
    attributes:
      value: |
        ## 🔒 Security Vulnerability Reporting

        > ## ⚠️ STOP — Do not submit security vulnerabilities as public issues

        Reporting a security vulnerability in a public issue puts **all users at risk**.

        Please use one of these **private** reporting channels:

        ### 🛡️ GitHub Security Advisories (Preferred)
        [Click here to report privately →](../../security/advisories/new)

        This is the fastest, most secure channel. Your report will only be visible
        to maintainers until a fix is released.

        ### 📬 Email
        Send details to: **abir2afridi@gmail.com**

        Encrypt your message with our PGP key if possible (see [SECURITY.md](../SECURITY.md)).

        ---

        ### ⏱️ Response Time
        We aim to acknowledge all security reports within **48 hours** and
        resolve critical issues within **7 days**.

        Thank you for practicing responsible disclosure. 🙏

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: ✅ Acknowledgement
      options:
        - label: >
            I understand this is not the correct form for security reports
            and I will use the private reporting channels listed above.
          required: true